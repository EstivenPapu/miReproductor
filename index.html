<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi reproductor</title>
<meta name="theme-color" content="#1B1F3B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EDEBF5;--surface:#FFFFFF;--text:#1B1F3B;--muted:#5B6088;--accent:#E8890C;--on-accent:#1B1F3B;--line:#D5D3E6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1B1F3B;--surface:#262B52;--text:#F1EEF8;--muted:#A3A8D0;--accent:#FFB703;--on-accent:#1B1F3B;--line:#363C70}
}
:root[data-theme="dark"]{--bg:#1B1F3B;--surface:#262B52;--text:#F1EEF8;--muted:#A3A8D0;--accent:#FFB703;--on-accent:#1B1F3B;--line:#363C70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 20px 40px}
h1{font-size:1.1rem;font-weight:800;margin:0 0 24px}
.disc{width:220px;height:220px;border-radius:50%;margin:0 auto 24px;position:relative;
  background:repeating-radial-gradient(circle at center,#14172E 0 2px,#1E2342 2px 5px);
  box-shadow:0 0 0 6px var(--surface)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 6px #14172E}
.disc::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--bg);z-index:1}
.playing .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.playing .disc{animation:none}}
#title{font-size:1.25rem;font-weight:800;text-align:center;margin:0 0 4px;overflow-wrap:anywhere}
#sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:.9rem}
.seek{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin:12px 0 28px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:currentColor}
.ic:focus-visible,.add:focus-visible,.track:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{width:68px;height:68px;background:var(--accent);color:var(--on-accent)}
.big svg{width:32px;height:32px}
.add{display:block;width:100%;padding:14px;border-radius:12px;border:2px dashed var(--line);background:transparent;font-weight:600;margin-bottom:16px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.track{display:block;flex:1;min-width:0;text-align:left;padding:12px 14px;border:0;background:transparent;overflow-wrap:anywhere}
.del{flex:none;width:48px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.del svg{width:22px;height:22px;fill:currentColor}
.del:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.track[aria-current="true"]{background:var(--surface);font-weight:800;border-left:4px solid var(--accent)}
.empty{color:var(--muted);text-align:center;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<main id="app">
  <h1>Mi reproductor</h1>
  <div class="disc" aria-hidden="true"></div>
  <p id="title">Nada reproduciéndose</p>
  <p id="sub">Agrega canciones de tu celular para empezar.</p>

  <div class="seek">
    <span id="cur">0:00</span>
    <input id="bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posición de la canción">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button class="ic" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="ic big" id="play" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
  </div>

  <button class="add" id="add">Agregar canciones</button>
  <input id="files" type="file" accept="audio/*" multiple class="hidden">
  <ul id="list"></ul>
  <p class="empty" id="empty">Todavía no hay canciones en la lista.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const audio = new Audio();
let tracks = [], cur = -1;

// Base de datos (IndexedDB): guarda las canciones en el celular
const STORE = 'songs';
let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('mi-reproductor', 1);
  r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
}));
const run = async (mode, fn) => {
  const d = await db();
  const req = fn(d.transaction(STORE, mode).objectStore(STORE));
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
};
const dbAll = () => run('readonly', s => s.getAll());
const dbAdd = rec => run('readwrite', s => s.add(rec));
const dbDel = id => run('readwrite', s => s.delete(id));

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

const fmt = t => {
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const clean = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');

function render() {
  const ul = $('#list');
  ul.innerHTML = '';
  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'track';
    b.textContent = t.name;
    if (i === cur) b.setAttribute('aria-current', 'true');
    b.onclick = () => play(i);
    const d = document.createElement('button');
    d.className = 'del';
    d.setAttribute('aria-label', 'Borrar ' + t.name);
    d.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>';
    d.onclick = () => remove(i);
    li.appendChild(b);
    li.appendChild(d);
    ul.appendChild(li);
  });
  $('#empty').classList.toggle('hidden', tracks.length > 0);
}

function setPlayingUI(on) {
  $('#app').classList.toggle('playing', on);
  $('#playicon').innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $('#play').setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
}

function play(i) {
  if (!tracks.length) return;
  cur = (i + tracks.length) % tracks.length;
  const t = tracks[cur];
  audio.src = t.url;
  audio.play().catch(() => setPlayingUI(false));
  $('#title').textContent = t.name;
  $('#sub').textContent = 'Canción ' + (cur + 1) + ' de ' + tracks.length;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: 'Mi música' });
  }
  render();
}

function toggle() {
  if (cur < 0) return play(0);
  audio.paused ? audio.play() : audio.pause();
}

$('#add').onclick = () => $('#files').click();
$('#files').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  const first = tracks.length;
  for (const f of files) {
    const name = clean(f.name);
    if (tracks.some(t => t.name === name && t.size === f.size)) continue;
    try {
      const id = await dbAdd({ name, size: f.size, blob: f, added: Date.now() });
      tracks.push({ id, name, size: f.size, url: URL.createObjectURL(f) });
    } catch (err) {
      $('#sub').textContent = 'No se pudo guardar "' + name + '". Puede que no haya espacio.';
    }
  }
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if (cur < 0 && tracks.length > first) play(first);
};

async function remove(i) {
  const t = tracks[i];
  if (!confirm('¿Borrar "' + t.name + '" de tu app?\nNo se borra de tu celular.')) return;
  try { await dbDel(t.id); }
  catch (err) { $('#sub').textContent = 'No se pudo borrar la canción.'; return; }
  URL.revokeObjectURL(t.url);
  tracks.splice(i, 1);
  if (i === cur) {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    cur = -1;
    $('#title').textContent = 'Nada reproduciéndose';
    $('#sub').textContent = tracks.length ? 'Elige una canción de la lista.' : 'Agrega canciones de tu celular para empezar.';
    $('#bar').value = 0; $('#cur').textContent = '0:00'; $('#dur').textContent = '0:00';
    setPlayingUI(false);
  } else if (i < cur) cur--;
  render();
}

async function init() {
  try {
    const rows = await dbAll();
    tracks = rows.map(r => ({ id: r.id, name: r.name, size: r.size, url: URL.createObjectURL(r.blob) }));
    if (tracks.length) $('#sub').textContent = 'Elige una canción de la lista.';
  } catch (err) {
    $('#sub').textContent = 'No se pudo abrir tu biblioteca guardada.';
  }
  render();
}
$('#play').onclick = toggle;
$('#next').onclick = () => play(cur + 1);
$('#prev').onclick = () => (audio.currentTime > 3 ? (audio.currentTime = 0) : play(cur - 1));

audio.onplay = () => setPlayingUI(true);
audio.onpause = () => setPlayingUI(false);
audio.onended = () => play(cur + 1);
audio.onloadedmetadata = () => { $('#dur').textContent = fmt(audio.duration); };
audio.ontimeupdate = () => {
  $('#cur').textContent = fmt(audio.currentTime);
  if (audio.duration) $('#bar').value = (audio.currentTime / audio.duration) * 100;
};
$('#bar').oninput = e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => audio.play());
  ms.setActionHandler('pause', () => audio.pause());
  ms.setActionHandler('previoustrack', () => play(cur - 1));
  ms.setActionHandler('nexttrack', () => play(cur + 1));
}
init();
</script>
</body>
</html>
