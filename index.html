<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi reproductor</title>
<meta name="theme-color" content="#1B1F3B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EDEBF5;--surface:#FFFFFF;--text:#1B1F3B;--muted:#5B6088;--accent:#E8890C;--on-accent:#1B1F3B;--line:#D5D3E6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1B1F3B;--surface:#262B52;--text:#F1EEF8;--muted:#A3A8D0;--accent:#FFB703;--on-accent:#1B1F3B;--line:#363C70}
}
:root[data-theme="dark"]{--bg:#1B1F3B;--surface:#262B52;--text:#F1EEF8;--muted:#A3A8D0;--accent:#FFB703;--on-accent:#1B1F3B;--line:#363C70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 20px 40px}
h1{font-size:1.1rem;font-weight:800;margin:0 0 24px}
.disc{width:220px;height:220px;border-radius:50%;margin:0 auto 24px;position:relative;
  background:repeating-radial-gradient(circle at center,#14172E 0 2px,#1E2342 2px 5px);
  box-shadow:0 0 0 6px var(--surface)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 6px #14172E}
.disc::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--bg);z-index:1}
.playing .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.playing .disc{animation:none}}
#title{font-size:1.25rem;font-weight:800;text-align:center;margin:0 0 4px;overflow-wrap:anywhere}
#sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:.9rem}
.seek{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin:12px 0 28px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:currentColor}
.ic:focus-visible,.add:focus-visible,.track:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{width:68px;height:68px;background:var(--accent);color:var(--on-accent)}
.big svg{width:32px;height:32px}
.add{display:block;width:100%;padding:14px;border-radius:12px;border:2px dashed var(--line);background:transparent;font-weight:600;margin-bottom:16px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.track{display:block;flex:1;min-width:0;text-align:left;padding:12px 14px;border:0;background:transparent;overflow-wrap:anywhere}
.del{flex:none;width:48px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.del svg{width:22px;height:22px;fill:currentColor}
.del:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.track[aria-current="true"]{background:var(--surface);font-weight:800;border-left:4px solid var(--accent)}
.add.main{border-style:solid;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 8px;padding:0 20px 8px}
.chip{flex:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.chip-new{border-style:dashed}
.chip:focus-visible,.sm:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.plbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 0 12px}
.plbar strong{font-size:1.05rem;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:.9rem}
.addpl{color:var(--accent)}
.muted{color:var(--muted)}
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:20px 20px 0 0;background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(10,12,30,.55)}
.sheet-in{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{font-size:1.1rem;margin:0 0 4px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.pick input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.newrow{display:flex;gap:8px;margin:16px 0}
.newrow input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit}
.btn{padding:12px 14px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.alt{background:transparent;border:1px solid var(--line);color:inherit;width:100%}

.empty{color:var(--muted);text-align:center;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<main id="app">
  <h1>Mi reproductor</h1>
  <div class="disc" aria-hidden="true"></div>
  <p id="title">Nada reproduciéndose</p>
  <p id="sub">Agrega canciones de tu celular para empezar.</p>

  <div class="seek">
    <span id="cur">0:00</span>
    <input id="bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posición de la canción">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button class="ic" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="ic big" id="play" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
  </div>

  <button class="add main" id="folder-btn">Buscar música en una carpeta</button>
  <button class="add" id="add">Agregar canciones sueltas</button>
  <input id="folder" type="file" webkitdirectory multiple class="hidden">
  <input id="files" type="file" accept="audio/*" multiple class="hidden">
  <div class="chips" id="chips" role="group" aria-label="Listas de reproducción"></div>
  <div class="plbar hidden" id="plbar">
    <strong id="plname"></strong>
    <div class="acts">
      <button class="sm" id="pl-play">Reproducir</button>
      <button class="sm" id="pl-rename">Renombrar</button>
      <button class="sm" id="pl-del">Borrar lista</button>
    </div>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty">Todavía no hay canciones en la lista.</p>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-in">
    <h2 id="sheet-title">Agregar a una lista</h2>
    <p class="muted" id="sheet-song"></p>
    <div id="sheet-lists"></div>
    <div class="newrow">
      <input id="newname" type="text" maxlength="40" placeholder="Nombre de la lista nueva" aria-label="Nombre de la lista nueva">
      <button class="btn" id="newbtn">Crear y agregar</button>
    </div>
    <button class="btn alt" id="sheet-close">Listo</button>
  </div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const audio = new Audio();
let tracks = [], cur = -1;

// Base de datos (IndexedDB): canciones y listas de reproducción
const STORE = 'songs', PL = 'playlists';
let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('mi-reproductor', 2);
  r.onupgradeneeded = () => {
    for (const n of [STORE, PL]) {
      if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
    }
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
}));
const run = async (store, mode, fn) => {
  const d = await db();
  const req = fn(d.transaction(store, mode).objectStore(store));
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
};
const dbAll = (st = STORE) => run(st, 'readonly', s => s.getAll());
const dbAdd = (rec, st = STORE) => run(st, 'readwrite', s => s.add(rec));
const dbDel = (id, st = STORE) => run(st, 'readwrite', s => s.delete(id));
const dbPut = (rec, st = PL) => run(st, 'readwrite', s => s.put(rec));

// Estado de las listas
let playlists = [], view = 'all', queue = [], sheetTrackId = null;

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

const fmt = t => {
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const clean = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');

const plById = id => playlists.find(p => p.id === id);
const nameOk = n => (n || '').trim().slice(0, 40);
const nameTaken = (n, exceptId) => playlists.some(p => p.id !== exceptId && p.name.toLowerCase() === n.toLowerCase());
const P_PLUS = 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z';
const P_TRASH = 'M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z';
const P_X = 'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z';

const iconBtn = (cls, label, path, fn) => {
  const b = document.createElement('button');
  b.className = cls;
  b.setAttribute('aria-label', label);
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + path + '"/></svg>';
  b.onclick = fn;
  return b;
};

function inView() {
  const pl = plById(view);
  if (!pl) return tracks.map((t, i) => i);
  return pl.songIds.map(id => tracks.findIndex(t => t.id === id)).filter(i => i >= 0);
}

function renderChips() {
  const box = $('#chips');
  const sl = box.scrollLeft;
  box.innerHTML = '';
  const mk = (label, active, fn, extra) => {
    const b = document.createElement('button');
    b.className = 'chip' + (extra ? ' ' + extra : '');
    b.textContent = label;
    b.setAttribute('aria-pressed', String(active));
    b.onclick = fn;
    box.appendChild(b);
  };
  mk('Todas (' + tracks.length + ')', view === 'all', () => { view = 'all'; render(); });
  playlists.forEach(p => mk(p.name, view === p.id, () => { view = p.id; render(); }));
  mk('+ Nueva lista', false, async () => {
    const n = nameOk(prompt('Nombre de la lista nueva'));
    if (!n) return;
    if (nameTaken(n)) { alert('Ya existe una lista con ese nombre.'); return; }
    try { const pl = await createPlaylist(n); view = pl.id; render(); }
    catch (err) { alert('No se pudo crear la lista.'); }
  }, 'chip-new');
  box.scrollLeft = sl;
}

function render() {
  if (view !== 'all' && !plById(view)) view = 'all';
  renderChips();
  const pl = plById(view);
  $('#plbar').classList.toggle('hidden', !pl);
  if (pl) $('#plname').textContent = pl.name + ' (' + inView().length + ')';
  const idx = inView();
  const ul = $('#list');
  ul.innerHTML = '';
  idx.forEach(i => {
    const t = tracks[i];
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'track';
    b.textContent = t.name;
    if (i === cur) b.setAttribute('aria-current', 'true');
    b.onclick = () => { queue = idx.map(k => tracks[k].id); play(i); };
    li.appendChild(b);
    li.appendChild(iconBtn('del addpl', 'Agregar ' + t.name + ' a una lista', P_PLUS, () => openSheet(t.id)));
    li.appendChild(pl
      ? iconBtn('del', 'Quitar ' + t.name + ' de esta lista', P_X, () => removeFromList(pl, t.id))
      : iconBtn('del', 'Borrar ' + t.name, P_TRASH, () => remove(i)));
    ul.appendChild(li);
  });
  const e = $('#empty');
  e.classList.toggle('hidden', idx.length > 0);
  e.textContent = pl ? 'Esta lista está vacía. Usa el botón + en una canción para agregarla.' : 'Todavía no hay canciones en la lista.';
}

// Listas de reproducción
async function createPlaylist(name) {
  const rec = { name, songIds: [], created: Date.now() };
  rec.id = await dbAdd(rec, PL);
  playlists.push(rec);
  return rec;
}
async function toggleInList(pl, id) {
  const next = pl.songIds.includes(id) ? pl.songIds.filter(x => x !== id) : [...pl.songIds, id];
  await dbPut({ ...pl, songIds: next });
  pl.songIds = next;
}
async function removeFromList(pl, id) {
  try {
    const next = pl.songIds.filter(x => x !== id);
    await dbPut({ ...pl, songIds: next });
    pl.songIds = next;
  } catch (err) { $('#sub').textContent = 'No se pudo quitar la canción de la lista.'; }
  render();
}
async function purge(id) {
  for (const pl of playlists) {
    if (pl.songIds.includes(id)) {
      try { const next = pl.songIds.filter(x => x !== id); await dbPut({ ...pl, songIds: next }); pl.songIds = next; } catch (err) {}
    }
  }
}

$('#pl-play').onclick = () => {
  const idx = inView();
  if (!idx.length) return;
  queue = idx.map(k => tracks[k].id);
  play(idx[0]);
};
$('#pl-rename').onclick = async () => {
  const pl = plById(view);
  if (!pl) return;
  const n = nameOk(prompt('Nuevo nombre de la lista', pl.name));
  if (!n || n === pl.name) return;
  if (nameTaken(n, pl.id)) { alert('Ya existe una lista con ese nombre.'); return; }
  try { await dbPut({ ...pl, name: n }); pl.name = n; } catch (err) { alert('No se pudo cambiar el nombre.'); }
  render();
};
$('#pl-del').onclick = async () => {
  const pl = plById(view);
  if (!pl) return;
  if (!confirm('¿Borrar la lista "' + pl.name + '"?\nLas canciones se quedan en tu biblioteca.')) return;
  try { await dbDel(pl.id, PL); } catch (err) { alert('No se pudo borrar la lista.'); return; }
  playlists = playlists.filter(p => p.id !== pl.id);
  view = 'all';
  render();
};

// Hoja para agregar una canción a listas
const sheet = $('#sheet');
function openSheet(trackId) {
  sheetTrackId = trackId;
  const t = tracks.find(x => x.id === trackId);
  $('#sheet-song').textContent = t ? t.name : '';
  renderSheet();
  sheet.showModal();
}
function renderSheet() {
  const box = $('#sheet-lists');
  box.innerHTML = '';
  if (!playlists.length) {
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'Todavía no tienes listas. Crea la primera aquí abajo.';
    box.appendChild(p);
  }
  playlists.forEach(pl => {
    const row = document.createElement('label');
    row.className = 'pick';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = pl.songIds.includes(sheetTrackId);
    cb.onchange = async () => {
      try { await toggleInList(pl, sheetTrackId); }
      catch (err) { cb.checked = !cb.checked; alert('No se pudo guardar el cambio.'); }
      render();
    };
    const sp = document.createElement('span');
    sp.textContent = pl.name;
    row.appendChild(cb);
    row.appendChild(sp);
    box.appendChild(row);
  });
}
$('#newbtn').onclick = async () => {
  const n = nameOk($('#newname').value);
  if (!n) return;
  if (nameTaken(n)) { alert('Ya existe una lista con ese nombre.'); return; }
  try {
    const pl = await createPlaylist(n);
    await toggleInList(pl, sheetTrackId);
    $('#newname').value = '';
  } catch (err) { alert('No se pudo crear la lista.'); }
  renderSheet();
  render();
};
$('#sheet-close').onclick = () => sheet.close();
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

// Siguiente / anterior respetan la lista que se está reproduciendo
function step(d) {
  if (!tracks.length) return;
  let ids = queue.filter(id => tracks.some(t => t.id === id));
  if (!ids.length) ids = tracks.map(t => t.id);
  const curId = cur >= 0 ? tracks[cur].id : null;
  let pos = ids.indexOf(curId);
  pos = pos < 0 ? (d > 0 ? 0 : ids.length - 1) : (pos + d + ids.length) % ids.length;
  play(tracks.findIndex(t => t.id === ids[pos]));
}

function setPlayingUI(on) {
  $('#app').classList.toggle('playing', on);
  $('#playicon').innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $('#play').setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
}

function play(i) {
  if (!tracks.length) return;
  cur = (i + tracks.length) % tracks.length;
  const t = tracks[cur];
  audio.src = t.url;
  audio.play().catch(() => setPlayingUI(false));
  $('#title').textContent = t.name;
  $('#sub').textContent = 'Canción ' + (cur + 1) + ' de ' + tracks.length;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: 'Mi música' });
  }
  render();
}

function toggle() {
  if (cur < 0) return play(0);
  audio.paused ? audio.play() : audio.pause();
}

$('#add').onclick = () => $('#files').click();
const AUDIO = /\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|weba|amr)$/i;
const MB = 1048576;
let importing = false;

async function importFiles(all) {
  if (importing) return;
  const audioFiles = all.filter(f => (f.type && f.type.startsWith('audio/')) || AUDIO.test(f.name));
  if (!audioFiles.length) { $('#sub').textContent = 'No encontré canciones en lo que elegiste.'; return; }
  const seen = new Set(tracks.map(t => t.name + '|' + t.size));
  const fresh = audioFiles.filter(f => {
    const k = clean(f.name) + '|' + f.size;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).sort((a, b) => a.name.localeCompare(b.name));
  const skipped = audioFiles.length - fresh.length;
  if (!fresh.length) { $('#sub').textContent = 'Todas esas canciones ya estaban en tu app.'; return; }

  const total = fresh.reduce((n, f) => n + f.size, 0);
  const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
  if (est && est.quota && total > est.quota - est.usage) {
    alert('No hay espacio suficiente: necesitas ' + Math.ceil(total / MB) + ' MB y quedan ' + Math.floor((est.quota - est.usage) / MB) + ' MB.');
    return;
  }
  if ((fresh.length > 20 || total > 200 * MB) &&
      !confirm('Se van a copiar ' + fresh.length + ' canciones (' + Math.ceil(total / MB) + ' MB) dentro de la app. ¿Continuar?')) return;

  importing = true;
  const first = tracks.length;
  let n = 0, failed = 0;
  for (const f of fresh) {
    const name = clean(f.name);
    $('#sub').textContent = 'Importando ' + (++n) + ' de ' + fresh.length + '…';
    try {
      const id = await dbAdd({ name, size: f.size, blob: f, added: Date.now() });
      tracks.push({ id, name, size: f.size, url: URL.createObjectURL(f) });
    } catch (err) { failed++; }
  }
  importing = false;
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  const msg = (n - failed) + ' canciones nuevas' + (skipped ? ', ' + skipped + ' ya estaban' : '') + (failed ? ', ' + failed + ' fallaron' : '') + '.';
  if (cur < 0 && tracks.length > first) play(first);
  $('#sub').textContent = msg;
}

async function walk(dir, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file') { if (AUDIO.test(name)) out.push(await h.getFile()); }
    else await walk(h, out);
  }
}

$('#files').onchange = e => { const f = [...e.target.files]; e.target.value = ''; importFiles(f); };
$('#folder').onchange = e => { const f = [...e.target.files]; e.target.value = ''; importFiles(f); };
$('#folder-btn').onclick = async () => {
  if (window.showDirectoryPicker) {
    try {
      const dir = await showDirectoryPicker({ mode: 'read' });
      $('#sub').textContent = 'Buscando canciones…';
      const out = [];
      await walk(dir, out);
      await importFiles(out);
    } catch (err) {
      if (err.name !== 'AbortError') $('#sub').textContent = 'No se pudo leer la carpeta.';
    }
  } else {
    $('#folder').click();
  }
};

async function remove(i) {
  const t = tracks[i];
  if (!confirm('¿Borrar "' + t.name + '" de tu app?\nNo se borra de tu celular.')) return;
  try { await dbDel(t.id); }
  catch (err) { $('#sub').textContent = 'No se pudo borrar la canción.'; return; }
  URL.revokeObjectURL(t.url);
  await purge(t.id);
  tracks.splice(i, 1);
  if (i === cur) {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    cur = -1;
    $('#title').textContent = 'Nada reproduciéndose';
    $('#sub').textContent = tracks.length ? 'Elige una canción de la lista.' : 'Agrega canciones de tu celular para empezar.';
    $('#bar').value = 0; $('#cur').textContent = '0:00'; $('#dur').textContent = '0:00';
    setPlayingUI(false);
  } else if (i < cur) cur--;
  render();
}

async function init() {
  try {
    playlists = (await dbAll(PL)).map(p => ({ ...p, songIds: p.songIds || [] }));
    const rows = await dbAll();
    tracks = rows.map(r => ({ id: r.id, name: r.name, size: r.size, url: URL.createObjectURL(r.blob) }));
    if (tracks.length) $('#sub').textContent = 'Elige una canción de la lista.';
  } catch (err) {
    $('#sub').textContent = 'No se pudo abrir tu biblioteca guardada.';
  }
  render();
}
$('#play').onclick = toggle;
$('#next').onclick = () => step(1);
$('#prev').onclick = () => (audio.currentTime > 3 ? (audio.currentTime = 0) : step(-1));

audio.onplay = () => setPlayingUI(true);
audio.onpause = () => setPlayingUI(false);
audio.onended = () => step(1);
audio.onloadedmetadata = () => { $('#dur').textContent = fmt(audio.duration); };
audio.ontimeupdate = () => {
  $('#cur').textContent = fmt(audio.currentTime);
  if (audio.duration) $('#bar').value = (audio.currentTime / audio.duration) * 100;
};
$('#bar').oninput = e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => audio.play());
  ms.setActionHandler('pause', () => audio.pause());
  ms.setActionHandler('previoustrack', () => step(-1));
  ms.setActionHandler('nexttrack', () => step(1));
}
init();
</script>
</body>
</html>
